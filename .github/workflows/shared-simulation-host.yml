name: Shared simulation host tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Fetch portable-test GLB assets
        run: >-
          git lfs fetch --include="assets/models/player/runtime/*.glb,assets/models/props/runtime/*.glb,assets/models/props/runtime/*/*.glb,assets/models/weapons/runtime/*.glb,tests/fixtures/*/*.glb"
          && git lfs checkout

      - name: Configure non-hardware host tests
        run: >-
          cmake -S . -B build/host-ci
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DHORDE_RT_BUILD_VULKAN_TARGETS=OFF

      - name: Build shared gameplay tests
        run: cmake --build build/host-ci --config Release --parallel 2

      - name: Run shared gameplay tests
        run: ctest --test-dir build/host-ci --build-config Release --output-on-failure
