plugins { id 'com.android.application' }
def hordeSource=providers.gradleProperty('hordeSource').get()
android {
    namespace 'com.samfa12.hordehybridlab'
    compileSdk 35
    ndkVersion '28.2.13676358'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'com.samfa12.hordehybridlab'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-experimental'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments "-DHORDE_SOURCE=${hordeSource}", '-DCMAKE_BUILD_TYPE=Release'; cppFlags '-std=c++20 -O2' } }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
    buildTypes { debug { debuggable true; jniDebuggable false; minifyEnabled false } }
}
