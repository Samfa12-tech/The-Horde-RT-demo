android {
    namespace 'com.samfa12.hordelanternrt'
    compileSdk 34
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.samfa12.hordelanternrt'
        minSdk 24
        targetSdk 34
        versionCode hordeVersionCode.intValue()
        versionName hordeVersionName
        buildConfigField 'boolean', 'PRIVATE_REVIVAL', 'false'
        buildConfigField 'boolean', 'FLASK_CANDIDATE', 'false'
        buildConfigField 'boolean', 'BELLWETHER_RESIDENT_CANDIDATE', 'false'
        buildConfigField 'boolean', 'BELLWETHER_ARTIFICER_CANDIDATE', 'false'
        buildConfigField 'boolean', 'BELLWETHER_SALVAGER_CANDIDATE', 'false'
        buildConfigField 'boolean', 'BELLWETHER_RELIC_DEALER_CANDIDATE', 'false'
        buildConfigField 'boolean', 'BELLWETHER_TEXTURED_TAVERN_KEEPER', 'false'
        buildConfigField 'boolean', 'BELLWETHER_COMBINED_RESIDENTS', 'false'
        buildConfigField 'boolean', 'BELLWETHER_VOICE_CANDIDATE', 'false'
        buildConfigField 'boolean', 'BELLWETHER_ARRIVAL_AUDITION', 'false'
        buildConfigField 'boolean', 'BELLWETHER_SALVAGER_AUDITION', 'false'
        buildConfigField 'boolean', 'SHIPPING17_CONTENT', 'false'
        buildConfigField 'boolean', 'VIEWMODEL_CANDIDATE', 'false'
        buildConfigField 'boolean', 'MOTION_VALIDATION', 'false'
        buildConfigField 'boolean', 'OUTDOOR_SCALE_PROBE', 'false'
        buildConfigField 'boolean', 'ACTOR_WORKER_EXPERIMENT', 'false'
        buildConfigField 'int', 'MIN_RENDER_SCALE_PERCENT', '25'
        resValue 'string', 'alpha_version', "SHOWCASE · ALPHA ${hordeVersionName}"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_static'
                arguments '-DHORDE_RT_ANDROID_BENCHMARK_VALIDATION=OFF', '-DHORDE_RT_MIN_RENDER_SCALE_PERCENT=25'
            }
        }
    }

    ndkVersion '26.1.10909125'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        if (!hordeValidationUnsigned && releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'PRIVATE_REVIVAL', privateRevivalDirectory ? 'true' : 'false'
            buildConfigField 'boolean', 'FLASK_CANDIDATE', flaskCandidateDirectory ? 'true' : 'false'
            buildConfigField 'boolean', 'BELLWETHER_RESIDENT_CANDIDATE', bellwetherResidentDirectory ? 'true' : 'false'
            buildConfigField 'boolean', 'BELLWETHER_ARTIFICER_CANDIDATE', bellwetherArtificer ? 'true' : 'false'
            buildConfigField 'boolean', 'BELLWETHER_SALVAGER_CANDIDATE', bellwetherSalvager ? 'true' : 'false'
            buildConfigField 'boolean', 'BELLWETHER_RELIC_DEALER_CANDIDATE', bellwetherRelicDealer ? 'true' : 'false'
            buildConfigField 'boolean', 'BELLWETHER_TEXTURED_TAVERN_KEEPER', texturedTavernKeeper ? 'true' : 'false'
            buildConfigField 'boolean', 'BELLWETHER_COMBINED_RESIDENTS', bellwetherCombinedResidents ? 'true' : 'false'
            buildConfigField 'boolean', 'BELLWETHER_VOICE_CANDIDATE', bellwetherVoiceDirectory ? 'true' : 'false'
            buildConfigField 'boolean', 'BELLWETHER_ARRIVAL_AUDITION', bellwetherArrivalAudition ? 'true' : 'false'
            buildConfigField 'boolean', 'BELLWETHER_SALVAGER_AUDITION', bellwetherSalvagerAudition ? 'true' : 'false'
            if (bellwetherResidentDirectory) {
                def rosterSuffix = bellwetherCombinedResidents ? '.debug.bellwether.combined' :
                    bellwetherRelicDealer ? '.debug.bellwether.dealer' :
                    (bellwetherSalvager ? '.debug.bellwether.shore' :
                    (bellwetherArtificer ? '.debug.bellwether.mill' : '.debug.bellwether'))
                applicationIdSuffix rosterSuffix + (flaskCandidateDirectory ? '.flask' : '')
                def rosterLabel = bellwetherCombinedResidents ? 'Horde RT Bellwether Combined Debug' :
                    bellwetherRelicDealer ? 'Horde RT Bellwether Dealer Debug' :
                    (bellwetherSalvager ? 'Horde RT Bellwether Shore Debug' :
                    (bellwetherArtificer ? 'Horde RT Bellwether Mill Debug' :
                    (flaskCandidateDirectory ? 'Horde RT Bellwether Flask Debug' : 'Horde RT Bellwether Debug')))
                resValue 'string', 'app_name', rosterLabel
            } else {
                applicationIdSuffix actorWorkerExperiment ? '.debug.actorworker' : (hordeStagedPrimaryDebugValidation ? '.debug.staged' : (viewmodelCandidate ? '.debug.viewmodel' : '.debug'))
            }
            buildConfigField 'boolean', 'VIEWMODEL_CANDIDATE', viewmodelCandidate ? 'true' : 'false'
            buildConfigField 'boolean', 'OUTDOOR_SCALE_PROBE', outdoorScaleProbe ? 'true' : 'false'
            buildConfigField 'boolean', 'ACTOR_WORKER_EXPERIMENT', actorWorkerExperiment ? 'true' : 'false'
            if (actorWorkerExperiment) resValue 'string', 'app_name', 'Horde RT Actor Worker Experiment'
            if (viewmodelCandidate) resValue 'string', 'app_name', 'Horde RT Viewmodel Candidate'
            if (hordeStagedPrimaryDebugValidation) resValue 'string', 'app_name', 'Horde RT Staged Investigation'
            versionNameSuffix '-debug'
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments "-DHORDE_RT_FLASK_CANDIDATE=${flaskCandidateDirectory ? 'ON' : 'OFF'}", "-DHORDE_RT_PRIVATE_REVIVAL=${privateRevivalDirectory ? 'ON' : 'OFF'}", '-DHORDE_RT_SHIPPING17_CONTENT=OFF', '-DHORDE_RT_DEBUG_CHECKPOINTS=ON',
                        "-DHORDE_RT_BELLWETHER_RESIDENT_CANDIDATE=${bellwetherResidentDirectory ? 'ON' : 'OFF'}",
                        "-DHORDE_RT_BELLWETHER_ARTIFICER_CANDIDATE=${bellwetherArtificer ? 'ON' : 'OFF'}",
                        "-DHORDE_RT_BELLWETHER_SALVAGER_CANDIDATE=${bellwetherSalvager ? 'ON' : 'OFF'}",
                        "-DHORDE_RT_BELLWETHER_RELIC_DEALER_CANDIDATE=${bellwetherRelicDealer ? 'ON' : 'OFF'}",
                        "-DHORDE_RT_BELLWETHER_COMBINED_RESIDENTS=${bellwetherCombinedResidents ? 'ON' : 'OFF'}",
                        *hordeRtDebugObservationArguments,
                        "-DHORDE_RT_DEBUG_VIEWMODEL_CANDIDATE=${viewmodelCandidate ? 'ON' : 'OFF'}",
                        *hordeRtNativePolicyArguments('Diagnostic'),
                        *hordeRtDebugStagedPrimaryArguments,
                        *hordeRegionPageDebugArguments
                }
            }
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'SHIPPING17_CONTENT', hordeShipping17AssetDirectory ? 'true' : 'false'
            externalNativeBuild {
                cmake {
                    arguments '-DHORDE_RT_PRIVATE_REVIVAL=OFF', '-DHORDE_RT_FLASK_CANDIDATE=OFF',
                        "-DHORDE_RT_SHIPPING17_CONTENT=${hordeShipping17AssetDirectory ? 'ON' : 'OFF'}",
                        '-DHORDE_RT_DEBUG_CHECKPOINTS=OFF', '-DHORDE_RT_DEBUG_VIEWMODEL_CANDIDATE=OFF',
                        '-DHORDE_RT_ACTOR_WORKER_EXPERIMENT=OFF',
                        *hordeRtNativePolicyArguments('Shipping')
                }
            }
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
        if (hordeBenchmarkValidation) {
            benchmark {
                initWith release
                applicationIdSuffix '.benchmark'
                versionNameSuffix '-benchmark'
                debuggable false
                jniDebuggable false
                signingConfig signingConfigs.debug
                buildConfigField 'int', 'MIN_RENDER_SCALE_PERCENT', hordeBenchmarkMinRenderScale.toString()
                buildConfigField 'boolean', 'MOTION_VALIDATION', hordeBenchmarkMotionValidation ? 'true' : 'false'
                externalNativeBuild {
                    cmake {
                        arguments '-DHORDE_RT_ANDROID_BENCHMARK_VALIDATION=ON',
                            "-DHORDE_RT_MIN_RENDER_SCALE_PERCENT=${hordeBenchmarkMinRenderScale}",
                            "-DHORDE_RT_ANDROID_PRESENT_TIMING_VALIDATION=${hordePresentTimingValidation ? 'ON' : 'OFF'}",
                            "-DHORDE_RT_ANDROID_MOTION_VALIDATION=${hordeBenchmarkMotionValidation ? 'ON' : 'OFF'}",
                            "-DHORDE_RT_STAGED_PRIMARY_SHADER_DIR=${hordeStagedPrimaryShaderDir ?: ''}",
                            "-DHORDE_RT_STAGED_PRIMARY_DEFAULT=${hordeStagedPrimaryShaderDir ? 'ON' : 'OFF'}",
                            "-DHORDE_RT_STAGED_PRIMARY_TIMING=${hordeStagedPrimaryTiming ? 'ON' : 'OFF'}"
                    }
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        main.assets.srcDirs = [runtimeAssetsDir.get().asFile]
        if (viewmodelCandidate) debug.assets.srcDir(viewmodelOverlayDir)
        if (privateRevivalDirectory) debug.assets.srcDir(file(privateRevivalDirectory))
        if (flaskCandidateDirectory) debug.assets.srcDir(file(flaskCandidateDirectory))
        if (bellwetherResidentDirectory) debug.assets.srcDir(bellwetherResidentDirectory)
        if (bellwetherVoiceDirectory) debug.assets.srcDir(bellwetherVoiceDirectory)
        if (hordeShipping17AssetDirectory) release.assets.srcDir(file(hordeShipping17AssetDirectory))
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

gradle.taskGraph.whenReady { graph ->
    if (bellwetherResidentDirectory &&
        graph.allTasks.any { it.project == project && it.name in ['assembleRelease','bundleRelease','packageRelease','assemble','bundle'] }) {
        throw new GradleException('Bellwether resident candidates are restricted to the separate Debug package.')
    }
    if (hordeVersionName == '1.7.0' && !hordeShipping17AssetDirectory &&
        graph.allTasks.any { it.project == project && it.name in ['assembleRelease','bundleRelease','packageRelease','assemble','bundle'] }) {
        throw new GradleException('Ordinary 1.7 Android release requires the pinned hordeShipping17AssetDir; refusing an incomplete package.')
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareRuntimeAssets')
}
if (viewmodelCandidate) {
    tasks.matching { it.name == 'preDebugBuild' }.configureEach {
        dependsOn tasks.named('prepareViewmodelCandidateAssets')
    }
}

// Hermetic policy evidence invokes this narrow task with explicit -P inputs.
// It intentionally reports the CMake arguments without configuring native code.
tasks.register('printHordeRtPolicyForTest') {
    doLast {
        println("debug=" + (hordeRtNativePolicyArguments('Diagnostic') + hordeRtDebugStagedPrimaryArguments + hordeRegionPageDebugArguments).join('|'))
        println("debugObservation=" + hordeRtDebugObservationArguments.join('|'))
        println("release=" + hordeRtNativePolicyArguments('Shipping').join('|'))
        println("benchmark=" + (hordeBenchmarkValidation
            ? (hordeRtNativePolicyArguments('Shipping') + hordeRtBenchmarkStagedPrimaryArguments).join('|')
            : 'unavailable; set hordeBenchmarkValidation=true'))
        println("benchmarkValidation=${hordeBenchmarkValidation}")
        println("debugMinRenderScale=25|releaseMinRenderScale=25|benchmarkMinRenderScale=${hordeBenchmarkMinRenderScale}")
        println("ordinaryPresentTiming=OFF|benchmarkPresentTiming=${hordePresentTimingValidation ? 'ON' : 'OFF'}")
        println("benchmarkMotionValidation=${hordeBenchmarkMotionValidation ? 'ON' : 'OFF'}")
        println("stagedPrimaryDebugValidation=${hordeStagedPrimaryDebugValidation}")
        println("stagedPrimaryShaderDir=${hordeStagedPrimaryShaderDir ?: ''}")
    }
}
