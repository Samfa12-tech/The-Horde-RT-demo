}

android {
    namespace 'com.samfa12.hordelanternrt'
    compileSdk 34
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.samfa12.hordelanternrt'
        minSdk 24
        targetSdk 34
        versionCode hordeVersionCode.intValue()
        versionName hordeVersionName
        buildConfigField 'boolean', 'VIEWMODEL_CANDIDATE', 'false'
        buildConfigField 'int', 'MIN_RENDER_SCALE_PERCENT', '50'
        resValue 'string', 'alpha_version', "SHOWCASE · ALPHA ${hordeVersionName}"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_static'
                arguments '-DHORDE_RT_ANDROID_BENCHMARK_VALIDATION=OFF', '-DHORDE_RT_MIN_RENDER_SCALE_PERCENT=50'
            }
        }
    }

    ndkVersion '26.1.10909125'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        if (!hordeValidationUnsigned && releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix hordeStagedPrimaryDebugValidation ? '.debug.staged' : (viewmodelCandidate ? '.debug.viewmodel' : '.debug')
            buildConfigField 'boolean', 'VIEWMODEL_CANDIDATE', viewmodelCandidate ? 'true' : 'false'
            if (viewmodelCandidate) resValue 'string', 'app_name', 'Horde RT Viewmodel Candidate'
            if (hordeStagedPrimaryDebugValidation) resValue 'string', 'app_name', 'Horde RT Staged Investigation'
            versionNameSuffix '-debug'
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments '-DHORDE_RT_DEBUG_CHECKPOINTS=ON',
                        "-DHORDE_RT_DEBUG_VIEWMODEL_CANDIDATE=${viewmodelCandidate ? 'ON' : 'OFF'}",
                        *hordeRtNativePolicyArguments('Diagnostic'),
                        *hordeRtDebugStagedPrimaryArguments
                }
            }
        }
        release {
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments '-DHORDE_RT_DEBUG_CHECKPOINTS=OFF', '-DHORDE_RT_DEBUG_VIEWMODEL_CANDIDATE=OFF',
                        *hordeRtNativePolicyArguments('Shipping')
                }
            }
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
        if (hordeBenchmarkValidation) {
            benchmark {
                initWith release
                applicationIdSuffix '.benchmark'
                versionNameSuffix '-benchmark'
                debuggable false
                jniDebuggable false
                signingConfig signingConfigs.debug
                buildConfigField 'int', 'MIN_RENDER_SCALE_PERCENT', hordeBenchmarkMinRenderScale.toString()
                externalNativeBuild {
                    cmake {
                        arguments '-DHORDE_RT_ANDROID_BENCHMARK_VALIDATION=ON',
                            "-DHORDE_RT_MIN_RENDER_SCALE_PERCENT=${hordeBenchmarkMinRenderScale}",
                            "-DHORDE_RT_STAGED_PRIMARY_SHADER_DIR=${hordeStagedPrimaryShaderDir ?: ''}",
                            "-DHORDE_RT_STAGED_PRIMARY_DEFAULT=${hordeStagedPrimaryShaderDir ? 'ON' : 'OFF'}",
                            "-DHORDE_RT_STAGED_PRIMARY_TIMING=${hordeStagedPrimaryTiming ? 'ON' : 'OFF'}"
                    }
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        main.assets.srcDirs = [runtimeAssetsDir.get().asFile]
        if (viewmodelCandidate) debug.assets.srcDir(viewmodelOverlayDir)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareRuntimeAssets')
}
if (viewmodelCandidate) {
    tasks.matching { it.name == 'preDebugBuild' }.configureEach {
        dependsOn tasks.named('prepareViewmodelCandidateAssets')
    }
}

// Hermetic policy evidence invokes this narrow task with explicit -P inputs.
// It intentionally reports the CMake arguments without configuring native code.
tasks.register('printHordeRtPolicyForTest') {
    doLast {
        println("debug=" + (hordeRtNativePolicyArguments('Diagnostic') + hordeRtDebugStagedPrimaryArguments).join('|'))
        println("release=" + hordeRtNativePolicyArguments('Shipping').join('|'))
        println("benchmark=" + (hordeBenchmarkValidation
            ? (hordeRtNativePolicyArguments('Shipping') + hordeRtBenchmarkStagedPrimaryArguments).join('|')
            : 'unavailable; set hordeBenchmarkValidation=true'))
        println("benchmarkValidation=${hordeBenchmarkValidation}")
        println("debugMinRenderScale=50|releaseMinRenderScale=50|benchmarkMinRenderScale=${hordeBenchmarkMinRenderScale}")
        println("stagedPrimaryDebugValidation=${hordeStagedPrimaryDebugValidation}")
        println("stagedPrimaryShaderDir=${hordeStagedPrimaryShaderDir ?: ''}")
    }
}
