plugins {
    id 'com.android.application'
}

import groovy.json.JsonSlurper
import java.nio.ByteBuffer
import java.nio.charset.CharacterCodingException
import java.nio.charset.CodingErrorAction
import java.nio.charset.StandardCharsets

def hordeVersionFile = rootProject.file('../VERSION')
def hordeVersionCodeMapFile = rootProject.file('../version-code-map.json')
def readHordeUtf8Authority = { File authorityFile, String authorityName ->
    def bytes = authorityFile.bytes
    if (bytes.length >= 3 && (bytes[0] & 0xff) == 0xef && (bytes[1] & 0xff) == 0xbb && (bytes[2] & 0xff) == 0xbf) {
        throw new GradleException("${authorityName} must be valid UTF-8 without a byte-order mark.")
    }
    try {
        return StandardCharsets.UTF_8.newDecoder()
            .onMalformedInput(CodingErrorAction.REPORT)
            .onUnmappableCharacter(CodingErrorAction.REPORT)
            .decode(ByteBuffer.wrap(bytes))
            .toString()
    } catch (CharacterCodingException exception) {
        throw new GradleException("${authorityName} must be valid UTF-8 without a byte-order mark.", exception)
    }
}

def hordeVersionRaw = readHordeUtf8Authority(hordeVersionFile, 'VERSION')
def hordeVersionMatcher = hordeVersionRaw =~ /^((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?:\r?\n)?$/
if (!hordeVersionMatcher.matches()) {
    throw new GradleException("VERSION must contain exactly one MAJOR.MINOR.PATCH line without whitespace.")
}
def hordeVersionName = hordeVersionMatcher.group(1)
def hordeVersionCodeMapRaw = readHordeUtf8Authority(hordeVersionCodeMapFile, 'Android version-code map')
def hordeVersionCodeMap = new JsonSlurper().parseText(hordeVersionCodeMapRaw)
if (!(hordeVersionCodeMap instanceof Map) || !(hordeVersionCodeMap.androidVersionCodes instanceof Map)) {
    throw new GradleException('Android version-code map androidVersionCodes must be an object.')
}
def hordeActiveAssignmentMatcher = java.util.regex.Pattern
    .compile('"' + java.util.regex.Pattern.quote(hordeVersionName) + '"\\s*:')
    .matcher(hordeVersionCodeMapRaw)
int hordeActiveAssignmentCount = 0
while (hordeActiveAssignmentMatcher.find()) {
    ++hordeActiveAssignmentCount
}
if (hordeActiveAssignmentCount != 1) {
    throw new GradleException("Android version-code map must contain exactly one active assignment for ${hordeVersionName}.")
}
def hordeVersionCode = hordeVersionCodeMap?.androidVersionCodes?[(hordeVersionName)]
if (!(hordeVersionCode instanceof Integer) || hordeVersionCode < 1) {
    throw new GradleException("Android version-code map has no positive integer for ${hordeVersionName}.")
}

def runtimeAssetsDir = layout.buildDirectory.dir('generated/runtimeAssets')
def validationUnsigned = System.getenv('HORDE_VALIDATION_UNSIGNED') == '1'
def releaseStoreFile = validationUnsigned ? null : System.getenv('HORDE_RELEASE_STORE_FILE')
def releaseStorePassword = validationUnsigned ? null : System.getenv('HORDE_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = validationUnsigned ? null : System.getenv('HORDE_RELEASE_KEY_ALIAS')
def releaseKeyPassword = validationUnsigned ? null : System.getenv('HORDE_RELEASE_KEY_PASSWORD')
def hordeRtInstrumentationOverride = providers.gradleProperty('hordeRtInstrumentationOverride').orNull
def hordeRtDielectricQualityOverride = providers.gradleProperty('hordeRtDielectricQualityOverride').orNull
def hordeRtOverridePresent = { String value -> value != null && !value.isEmpty() }
if (hordeRtOverridePresent(hordeRtInstrumentationOverride) != hordeRtOverridePresent(hordeRtDielectricQualityOverride)) {
    throw new GradleException('hordeRtInstrumentationOverride and hordeRtDielectricQualityOverride must be supplied together.')
}
if (hordeRtOverridePresent(hordeRtInstrumentationOverride) &&
    !(hordeRtInstrumentationOverride == 'Shipping' || hordeRtInstrumentationOverride == 'Diagnostic')) {
    throw new GradleException('hordeRtInstrumentationOverride must be exactly Shipping or Diagnostic.')
}
if (hordeRtOverridePresent(hordeRtDielectricQualityOverride) &&
    !(hordeRtDielectricQualityOverride == 'Mobile' || hordeRtDielectricQualityOverride == 'High')) {
    throw new GradleException('hordeRtDielectricQualityOverride must be exactly Mobile or High.')
}
def hordeRtNativePolicyArguments = { String defaultInstrumentation ->
    def instrumentation = hordeRtOverridePresent(hordeRtInstrumentationOverride) ? hordeRtInstrumentationOverride : defaultInstrumentation
    def quality = hordeRtOverridePresent(hordeRtDielectricQualityOverride) ? hordeRtDielectricQualityOverride : 'Mobile'
    return ["-DHORDE_RT_ANDROID_DEFAULT_INSTRUMENTATION=${instrumentation}",
            "-DHORDE_RT_ANDROID_DEFAULT_DIELECTRIC_QUALITY=${quality}"]
}

tasks.register('prepareRuntimeAssets', Sync) {
    from('../../assets') {
        include 'models/enemies/meshy/skeleton_biped_merged_animations_v01.glb'
        include 'models/enemies/meshy/lich_placeholder_merged_animations_v01.glb'
        include 'textures/polyhaven/mobile_1k/diff-array-512-astc6x6.ktx2'
        include 'textures/polyhaven/mobile_1k/normal-array-512-astc4x4.ktx2'
        include 'textures/polyhaven/mobile_1k/arm-array-512-astc6x6.ktx2'
        include 'textures/meshy/lich_placeholder_v01/base-color-2048-astc6x6.ktx2'
        include 'textures/meshy/lich_placeholder_v01/emissive-2048-astc6x6.ktx2'
        include 'models/weapons/runtime/asset.manifest.json'
        include 'models/weapons/runtime/gothic-arming-sword-rh-lod0.runtime.glb'
        include 'models/props/runtime/asset.manifest.json'
        include 'models/props/runtime/gothic-hand-torch-lod0.runtime.glb'
        include 'models/props/runtime/dielectric-fixture/asset.manifest.json'
        include 'models/props/runtime/dielectric-fixture/closed-glass-lod0.runtime.glb'
        include 'models/props/runtime/gothic-chest-base/asset.manifest.json'
        include 'models/props/runtime/gothic-chest-base/gothic-chest-base-lod0.runtime.glb'
        include 'models/props/runtime/gothic-chest-lid/asset.manifest.json'
        include 'models/props/runtime/gothic-chest-lid/gothic-chest-lid-lod0.runtime.glb'
        include 'models/props/runtime/reward-lantern-ring/asset.manifest.json'
        include 'models/props/runtime/reward-lantern-ring/reward-lantern-ring-lod0.runtime.glb'
        include 'models/props/runtime/reward-lantern-body/asset.manifest.json'
        include 'models/props/runtime/reward-lantern-body/reward-lantern-body-lod0.runtime.glb'
        include 'models/player/runtime/asset.manifest.json'
        include 'models/player/runtime/clip-manifest.json'
        include 'models/player/runtime/gothic-traveller-lod0.runtime.glb'
        include 'textures/props/runtime/*.android.ktx2'
        include 'textures/props/runtime/asset.manifest.json'
        include 'audio/filmcow/*.wav'
        include 'audio/pixabay/waterfall_loop.wav'
        include 'audio/pixabay/chest_unlock.wav'
        include 'audio/pixabay/chest_open.wav'
        include 'audio/pixabay/torch_extinguish.wav'
    }
    from('../..') {
        include 'ASSET_LICENSES.md'
    }
    into runtimeAssetsDir
}

android {
    namespace 'com.samfa12.hordelanternrt'
    compileSdk 34

    defaultConfig {
        applicationId 'com.samfa12.hordelanternrt'
        minSdk 24
        targetSdk 34
        versionCode hordeVersionCode.intValue()
        versionName hordeVersionName
        resValue 'string', 'alpha_version', "SHOWCASE · ALPHA ${hordeVersionName}"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    ndkVersion '26.1.10909125'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        if (!validationUnsigned && releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments '-DHORDE_RT_DEBUG_CHECKPOINTS=ON', *hordeRtNativePolicyArguments('Diagnostic')
                }
            }
        }
        release {
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments '-DHORDE_RT_DEBUG_CHECKPOINTS=OFF', *hordeRtNativePolicyArguments('Shipping')
                }
            }
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        main.assets.srcDirs = [runtimeAssetsDir.get().asFile]
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareRuntimeAssets')
}
