// Explicit private owner candidate; binaries stay outside Git and public runtime assets.
def privateRevivalDirectory = providers.gradleProperty('hordePrivateRevivalDir').orNull
if(privateRevivalDirectory) {
    def privateRoot=file(privateRevivalDirectory)
    def privateFiles=[]
    privateRoot.eachFileRecurse(groovy.io.FileType.FILES) { privateFiles.add(privateRoot.toPath().relativize(it.toPath()).toString().replace('\\','/')) }
    if(privateFiles.sort()!=['private_revival/lich_revival.wav','private_revival/skeleton.glb'])
        throw new GradleException('Private revival directory must contain only the two pinned runtime derivatives; no source audio/models.')
    ['skeleton.glb':'800632b9b1dbe53bd4f6508a6d167e52e940c6bdb4e902af752429e96d7fe259',
     'lich_revival.wav':'1e1891010f4c89e6f20ec5fba90191aa0f0999c0bd95a4df3fe36659beb9e521'].each { name,expected ->
        def asset=new File(privateRoot,'private_revival/'+name)
        if(!asset.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString()!=expected)
            throw new GradleException('Private revival requires the exact admitted local '+name)
    }
}

