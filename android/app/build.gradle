def verifyBellwetherOverlay = { File root, Map pinned, String label ->
    if (!root.isDirectory()) throw new GradleException("Bellwether ${label} root is missing.")
    def actual = []
    root.eachFileRecurse(groovy.io.FileType.FILES) {
        actual.add(root.toPath().relativize(it.toPath()).toString().replace('\\','/'))
    }
    if (actual.sort() != pinned.keySet().toList().sort())
        throw new GradleException("Bellwether ${label} requires exactly the pinned files.")
    pinned.each { relative, expected ->
        def asset = new File(root, relative)
        if (MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString() != expected)
            throw new GradleException("Bellwether ${label} asset differs: ${relative}")
    }
}
