        include 'models/props/runtime/dielectric-fixture/closed-glass-lod0.runtime.glb'
        include 'models/props/runtime/gothic-chest-base/asset.manifest.json'
        include 'models/props/runtime/gothic-chest-base/gothic-chest-base-lod0.runtime.glb'
        include 'models/props/runtime/gothic-chest-lid/asset.manifest.json'
        include 'models/props/runtime/gothic-chest-lid/gothic-chest-lid-lod0.runtime.glb'
        include 'models/props/runtime/reward-lantern-ring/asset.manifest.json'
        include 'models/props/runtime/reward-lantern-ring/reward-lantern-ring-lod0.runtime.glb'
        include 'models/props/runtime/reward-lantern-body/asset.manifest.json'
        include 'models/props/runtime/reward-lantern-body/reward-lantern-body-lod0.runtime.glb'
        include 'models/player/runtime/asset.manifest.json'
        include 'models/player/runtime/clip-manifest.json'
        include 'models/player/runtime/gothic-traveller-lod0.runtime.glb'
        include 'models/player/viewmodel/runtime/asset.manifest.json'
        include 'models/player/viewmodel/runtime/gothic-traveller-viewmodel.runtime.glb'
        include 'textures/props/runtime/base-color.android.ktx2'
        include 'textures/props/runtime/normal.android.ktx2'
        include 'textures/props/runtime/orm.android.ktx2'
        include 'textures/props/runtime/emissive.android.ktx2'
        include 'textures/props/runtime/asset.manifest.json'
        include 'audio/filmcow/*.wav'
        include 'audio/pixabay/waterfall_core_loop.wav'
        include 'audio/pixabay/waterfall-core.manifest.json'
        include 'audio/pixabay/chest_unlock.wav'
        include 'audio/pixabay/chest_open.wav'
        include 'audio/pixabay/torch_extinguish.wav'
        include 'audio/pixabay/keeper_i_sense_you.wav'
        include 'audio/pixabay/keeper_come_closer.wav'
        include 'audio/pixabay/skeleton_idle_rattle.wav'
        include 'audio/pixabay/skeleton_falling_bones.wav'
        include 'audio/pixabay/keeper-asset.manifest.json'
        include 'textures/environment/runtime/night-storm.android.ktx2'
        include 'textures/environment/runtime/asset.manifest.json'
        include 'audio/music/what-the-dark-keeps/asset.manifest.json'
        include 'audio/music/what-the-dark-keeps/runtime/*.wav'
    }
    from('../..') {
        include 'ASSET_LICENSES.md'
    }
    from('../../third_party/cgltf') {
        include 'LICENSE'
